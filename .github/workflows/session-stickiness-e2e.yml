name: Window Sticker - IP Lock & Currency Conversion E2E Suite

permissions:
  contents: write
  issues: write
  pages: write
  actions: write
  id-token: write

concurrency:
  group: stickiness-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    # Run daily at 12:00 UTC
    - cron: '0 12 * * *'
  push:
    paths:
      - 'tests/session_ip_stickiness.spec.ts'
      - 'tasks/SessionIpStickinessTask.ts'
    branches: [main]
  workflow_dispatch:
    inputs:
      site_filter:
        description: 'Select website to run (or "all" for all websites)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - toyota
          - dodge
          - honda
          - kia
          - audi
          - porsche
          - mercedes
          - cadillac
          - gmc
          - lexus
          - gm
          - alfaromeo
          - ford
          - chevrolet
          - bmw
          - jeep
          - hyundai
          - mclaren
          - ram
          - chrysler
          - buick
          - mitsubishi
          - lincoln
          - volvo
          - volkswagen
          - subaru
          - vwwindowstickers
          - minicooper
          - fordlookup
          - infiniti

env:
  UV_THREADPOOL_SIZE: 64
  NODE_OPTIONS: "--dns-result-order=ipv4first"

jobs:
  # ─────────────────────────────────────────────────────────────
  # STEP 1: RUN SESSION STICKINESS AUDITS (6 HIGH-SPEED SHARDS)
  # ─────────────────────────────────────────────────────────────
  stickiness-shards:
    name: 🔒 IP Lock & Currency Shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: ['1/6', '2/6', '3/6', '4/6', '5/6', '6/6']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright Version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers (Chromium)
        run: npx playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Mask Sensitive Secrets in CI Logs
        run: |
          echo "::add-mask::${{ secrets.GEMINI_API_KEY }}"
          echo "::add-mask::${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Pre-warm DNS Cache & Static Host Mappings
        run: node -e "require('./global-setup.js')()"

      - name: Execute Session Stickiness Tests (${{ matrix.shard }})
        run: |
          FILTER="${{ github.event.inputs.site_filter || 'all' }}"
          if [ "$FILTER" != "all" ] && [ -n "$FILTER" ]; then
            SITE_NAME=$(node -e "
              const sites = require('./sites.json');
              const filter = '$FILTER';
              const s = sites.find(x => x.id === filter || x.brand === filter || x.name.toLowerCase().includes(filter.toLowerCase()));
              console.log(s ? s.name : filter);
            ")
            if [ "${{ matrix.shard }}" = "1/6" ]; then
              echo "🎯 Running Session Stickiness for single domain: $SITE_NAME"
              npx playwright test tests/session_ip_stickiness.spec.ts --project="$SITE_NAME" --workers=2
            else
              echo "⏭️ Single domain selected ($FILTER). Skipping redundant shard ${{ matrix.shard }}."
            fi
          else
            echo "🚀 Running 6-Shard Session Stickiness Matrix (${{ matrix.shard }}) across all 30 domains..."
            npx playwright test tests/session_ip_stickiness.spec.ts --shard=${{ matrix.shard }} --workers=2
          fi
        env:
          CI: true
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload Stickiness Blob Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-blob-reports-stickiness-${{ strategy.job-index }}
          path: blob-report/
          retention-days: 2

      - name: Upload Stickiness Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-stickiness-${{ strategy.job-index }}
          path: allure-results/
          retention-days: 2

      - name: Upload Failure Videos (if failed)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-stickiness-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # STEP 2: CONSOLIDATE & REPORT (BLOB + ALLURE + NOTIFICATIONS)
  # ─────────────────────────────────────────────────────────────
  merge-stickiness-reports:
    name: 📊 Consolidate Stickiness & Slack Alert
    if: always()
    needs: [stickiness-shards]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java Runtime for Allure
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download all Stickiness Blob Reports
        uses: actions/download-artifact@v4
        with:
          path: all-blobs
          pattern: all-blob-reports-stickiness-*
          merge-multiple: true

      - name: Merge Playwright Reports
        run: |
          npx playwright merge-reports --config=merge.config.js ./all-blobs
        env:
          CI: true
          PLAYWRIGHT_REPORT_DIR: playwright-report-ip-lock

      - name: Download all Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-stickiness-*
          path: all-allure-results
          merge-multiple: true

      - name: Generate Allure Report
        run: |
          npx allure generate all-allure-results --clean -o allure-report-out

      - name: Send Slack Notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_SERVER: ${{ github.server_url }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref_name }}
          GITHUB_SHA_VAL: ${{ github.sha }}
          GITHUB_EVENT: ${{ github.event_name }}
          SITE_FILTER: ${{ github.event.inputs.site_filter || 'all' }}
          SUITE_TYPE: 'IP Lock & Currency Conversion Suite'
          PLAYWRIGHT_REPORT_DIR: playwright-report-ip-lock
          REPORT_SUBPATH: 'ip-lock'
        run: |
          node scripts/slack-notify.js

      - name: Prepare Combined GitHub Pages Deployment Directory
        if: always()
        run: |
          # Clone existing gh-pages branch to preserve other workflows and historical runs
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-deploy 2>/dev/null || mkdir -p gh-deploy
          rm -rf gh-deploy/.git
          touch gh-deploy/.nojekyll

          # Deploy latest ip-lock report
          mkdir -p gh-deploy/ip-lock/playwright
          cp -r playwright-report-ip-lock/* gh-deploy/ip-lock/playwright/ 2>/dev/null || true
          rm -f gh-deploy/ip-lock/playwright/results.json

          # Archive Run-Specific History (never overwritten)
          RUN_DIR="gh-deploy/history/runs/${{ github.run_number }}/ip-lock"
          mkdir -p "$RUN_DIR"
          cp -r playwright-report-ip-lock/* "$RUN_DIR/" 2>/dev/null || true

          if [ -d "allure-report-out" ]; then
            mkdir -p gh-deploy/ip-lock/allure
            cp -r allure-report-out/* gh-deploy/ip-lock/allure/ 2>/dev/null || true
          fi
          find gh-deploy -type f -name '*.zip' -size +10M -delete
          find gh-deploy -type f -size +20M -delete

      - name: Upload Final Consolidated Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-ip-lock-run-${{ github.run_number }}-${{ github.run_attempt }}
          path: playwright-report-ip-lock/
          retention-days: 30

      - name: Upload Final Consolidated Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-ip-lock-run-${{ github.run_number }}-${{ github.run_attempt }}
          path: allure-report-out/
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: ./gh-deploy

      - name: Deploy consolidated reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: always()
