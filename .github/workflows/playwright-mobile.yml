name: Window Sticker - Mobile Chrome E2E Suite

permissions:
  contents: write
  issues: write
  pages: write
  actions: write
  id-token: write

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    # Run daily at 02:00 UTC (staggered after Desktop suite at 00:00 UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      site_filter:
        description: 'Select website to run (or "all" for all websites)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - toyota
          - dodge
          - honda
          - kia
          - audi
          - porsche
          - mercedes
          - cadillac
          - gmc
          - lexus
          - gm
          - alfaromeo
          - ford
          - chevrolet
          - bmw
          - jeep
          - hyundai
          - mclaren
          - ram
          - chrysler
          - buick
          - mitsubishi
          - lincoln
          - volvo
          - volkswagen
          - subaru
          - vwwindowstickers
          - minicooper
          - fordlookup
          - infiniti

env:
  UV_THREADPOOL_SIZE: 64
  NODE_OPTIONS: "--dns-result-order=ipv4first"

jobs:
  # ─────────────────────────────────────────────────────────────
  # STEP 1: SETUP DYNAMIC MATRIX FROM sites.json
  # ─────────────────────────────────────────────────────────────
  setup:
    name: ⚙️ Setup Mobile Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pre-warm DNS Cache & Static Host Mappings
        run: node -e "require('./global-setup.js')()"

      - name: Generate Dynamic Matrix Output
        id: set-matrix
        run: |
          FILTER="${{ github.event.inputs.site_filter || 'all' }}"
          MATRIX_JSON=$(node -e "
            const sites = require('./sites.json');
            let flowMap = {};
            try { flowMap = require('./flow-detection.json'); } catch(e) {}
            const filter = '$FILTER';
            let list = (filter !== 'all' && filter) 
              ? sites.filter(s => s.id === filter || s.brand === filter || s.name.toLowerCase().includes(filter.toLowerCase()))
              : sites;
            if (!list.length) list = sites;
            const enriched = list.map(s => ({
              ...s,
              flow: flowMap[s.name] || 'streaming'
            }));
            console.log(JSON.stringify(enriched));
          ")
          echo "matrix=${MATRIX_JSON}" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────
  # STEP 2: RUN MOBILE CHROME FUNNEL PER SITE (PARALLEL RUNNERS)
  # ─────────────────────────────────────────────────────────────
  test-site:
    name: 📱 Mobile • ${{ matrix.site.name }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJson(needs.setup.outputs.matrix) }}
        browser:
          - MobileChrome

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright Version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers (Chromium)
        run: npx playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Mask Sensitive Secrets in CI Logs
        run: |
          echo "::add-mask::${{ secrets.GEMINI_API_KEY }}"
          echo "::add-mask::${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Pre-warm DNS Cache & Static Host Mappings
        run: node -e "require('./global-setup.js')()"

      - name: Run Mobile Chrome Checkout Funnel tests for ${{ matrix.site.name }}
        id: playwright-run
        continue-on-error: true
        run: |
          PROJECT_NAME="${{ matrix.site.name }}_MobileChrome"
          echo "🚀 Running Mobile Chrome Checkout Funnel for Project: $PROJECT_NAME (Detected Flow: ${{ matrix.site.flow }}) on URL: ${{ matrix.site.url }}"
          node scripts/run-flow.js --project="$PROJECT_NAME"
        env:
          CI: true
          BASE_URL: "${{ matrix.site.url }}"
          FLOW_TYPE: "${{ matrix.site.flow }}"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run AI Agentic Self-Healer (On Test Failure)
        if: steps.playwright-run.outcome == 'failure'
        timeout-minutes: 5
        run: |
          PLAYWRIGHT_PROJECT="${{ matrix.site.name }}_MobileChrome" npm run heal:prod
        env:
          CI: true
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload Blob Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-blob-reports-mobile-${{ matrix.site.id }}
          path: blob-report/
          retention-days: 2

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-mobile-${{ matrix.site.id }}
          path: allure-results/
          retention-days: 2

      - name: Upload Raw Test Results & Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-mobile-${{ matrix.site.id }}
          path: test-results/
          retention-days: 7


  # ─────────────────────────────────────────────────────────────
  # STEP 3: CONSOLIDATE & REPORT (BLOB + ALLURE + NOTIFICATIONS)
  # ─────────────────────────────────────────────────────────────
  merge-reports:
    name: 📊 Consolidate Mobile Reports & Notify
    if: always()
    needs: [test-site]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java Runtime for Allure
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download all Blob Reports
        uses: actions/download-artifact@v4
        with:
          path: all-blobs
          pattern: all-blob-reports-mobile-*
          merge-multiple: true

      - name: Merge Playwright Reports
        run: |
          npx playwright merge-reports --config=merge.config.js ./all-blobs
        env:
          CI: true
          PLAYWRIGHT_REPORT_DIR: playwright-report-mobile

      - name: Download all Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-mobile-*
          path: all-allure-results
          merge-multiple: true

      - name: Generate Allure Report
        run: |
          npx allure generate all-allure-results --clean -o allure-report-out-mobile

      - name: Send Slack Notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_SERVER: ${{ github.server_url }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref_name }}
          GITHUB_SHA_VAL: ${{ github.sha }}
          GITHUB_EVENT: ${{ github.event_name }}
          SITE_FILTER: ${{ github.event.inputs.site_filter || 'all' }}
          SUITE_TYPE: 'Mobile Chrome Funnel Suite'
          PLAYWRIGHT_REPORT_DIR: playwright-report-mobile
          REPORT_SUBPATH: 'mobile'
        run: |
          node scripts/slack-notify.js

      - name: Prepare Combined GitHub Pages Deployment Directory
        if: always()
        run: |
          # Clone existing gh-pages branch to preserve other workflows and historical runs
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-deploy 2>/dev/null || mkdir -p gh-deploy
          rm -rf gh-deploy/.git
          touch gh-deploy/.nojekyll

          # Deploy latest Mobile Chrome report
          mkdir -p gh-deploy/mobile/playwright
          cp -r playwright-report-mobile/* gh-deploy/mobile/playwright/ 2>/dev/null || true
          rm -f gh-deploy/mobile/playwright/results.json

          # Archive Run-Specific History (never overwritten)
          RUN_DIR="gh-deploy/history/runs/${{ github.run_number }}/mobile"
          mkdir -p "$RUN_DIR"
          cp -r playwright-report-mobile/* "$RUN_DIR/" 2>/dev/null || true

          if [ -d "allure-report-out-mobile" ]; then
            mkdir -p gh-deploy/mobile/allure
            cp -r allure-report-out-mobile/* gh-deploy/mobile/allure/ 2>/dev/null || true
          fi
          # Keep GitHub Pages within storage budget: drop heavy trace archives > 10MB, but preserve failure videos
          find gh-deploy -type f -name '*.zip' -size +10M -delete
          find gh-deploy -type f -size +20M -delete
          echo "📦 GitHub Pages payload size:"; du -sh gh-deploy

      - name: Manage GitHub Issues on Failure / Resolution
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          node scripts/manage-issues.js

      - name: Upload Final Consolidated Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-mobile-run-${{ github.run_number }}-${{ github.run_attempt }}
          path: playwright-report-mobile/
          retention-days: 30

      - name: Upload Final Consolidated Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-mobile-run-${{ github.run_number }}-${{ github.run_attempt }}
          path: allure-report-out-mobile/
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: ./gh-deploy

      - name: Deploy consolidated reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: always()
