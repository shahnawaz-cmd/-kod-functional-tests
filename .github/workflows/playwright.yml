name: Window Sticker - Orchestrator E2E Suite

permissions:
  contents: write
  issues: write
  pages: write
  actions: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Select Test Suite to Run'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'pricing'
          - 'funnel'
      site_filter:
        description: 'Select website to run (or "all" for all websites)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - toyota
          - dodge
          - honda
          - kia
          - audi
          - porsche
          - mercedes
          - cadillac
          - gmc
          - lexus
          - gm
          - alfaromeo
          - ford
          - chevrolet
          - bmw
          - jeep
          - hyundai
          - mclaren
          - ram
          - chrysler
          - buick
          - mitsubishi
          - lincoln
          - volvo
          - volkswagen
          - subaru
          - vwwindowstickers
          - minicooper
          - fordlookup
          - infiniti

env:
  UV_THREADPOOL_SIZE: 64
  NODE_OPTIONS: "--dns-result-order=ipv4first"

jobs:
  # ─────────────────────────────────────────────────────────────
  # STEP 1: SETUP DYNAMIC MATRIX FROM sites.json
  # ─────────────────────────────────────────────────────────────
  setup:
    name: ⚙️ Setup Orchestrator Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pre-warm DNS Cache & Static Host Mappings
        run: node -e "require('./global-setup.js')()"

      - name: Generate Dynamic Matrix Output
        id: set-matrix
        run: |
          FILTER="${{ github.event.inputs.site_filter || 'all' }}"
          if [ "$FILTER" != "all" ] && [ -n "$FILTER" ]; then
            echo "Filtering for site: $FILTER"
            MATRIX_JSON=$(node -e "
              const sites = require('./sites.json');
              const filtered = sites.filter(s => s.id === '$FILTER' || s.brand === '$FILTER' || s.name.toLowerCase().includes('$FILTER'.toLowerCase()));
              console.log(JSON.stringify(filtered.length ? filtered : sites));
            ")
          else
            MATRIX_JSON=$(cat sites.json | tr -d '\n' | tr -d ' ')
          fi
          echo "matrix=${MATRIX_JSON}" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────
  # STEP 2A: RUN CHECKOUT FUNNEL PER SITE (FULL PARALLEL RUNNERS)
  # ─────────────────────────────────────────────────────────────
  test-site:
    name: 🛒 Funnel • ${{ matrix.site.name }} (${{ matrix.browser }})
    if: github.event.inputs.suite == 'both' || github.event.inputs.suite == 'funnel' || !github.event.inputs.suite
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJson(needs.setup.outputs.matrix) }}
        browser:
          - Desktop
          - MobileChrome

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright Version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers (Chromium)
        run: npx playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Mask Sensitive Secrets in CI Logs
        run: |
          echo "::add-mask::${{ secrets.GEMINI_API_KEY }}"
          echo "::add-mask::${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Pre-warm DNS Cache & Static Host Mappings
        run: node -e "require('./global-setup.js')()"

      - name: Run Checkout Funnel tests for ${{ matrix.site.name }}
        id: playwright-run
        continue-on-error: true
        run: |
          if [ "${{ matrix.browser }}" = "Desktop" ]; then
            PROJECT_NAME="${{ matrix.site.name }}"
          else
            PROJECT_NAME="${{ matrix.site.name }}_${{ matrix.browser }}"
          fi
          echo "🚀 Detecting Flow and Running Checkout Funnel for Project: $PROJECT_NAME on URL: ${{ matrix.site.url }}"
          node scripts/run-flow.js --project="$PROJECT_NAME"
        env:
          CI: true
          BASE_URL: "${{ matrix.site.url }}"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run AI Agentic Self-Healer (On Test Failure)
        if: steps.playwright-run.outcome == 'failure'
        timeout-minutes: 5
        run: |
          if [ "${{ matrix.browser }}" = "Desktop" ]; then
            PROJECT_NAME="${{ matrix.site.name }}"
          else
            PROJECT_NAME="${{ matrix.site.name }}_${{ matrix.browser }}"
          fi
          PLAYWRIGHT_PROJECT=$PROJECT_NAME npm run heal:prod
        env:
          CI: true
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload Blob Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-blob-reports-funnel-${{ matrix.site.id }}-${{ matrix.browser }}
          path: blob-report/
          retention-days: 2

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-funnel-${{ matrix.site.id }}-${{ matrix.browser }}
          path: allure-results/
          retention-days: 2

      - name: Upload Raw Test Results & Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-funnel-${{ matrix.site.id }}-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

      - name: Send Instant Slack Failure Alert for ${{ matrix.site.name }} Funnel (${{ matrix.browser }})
        if: steps.playwright-run.outcome == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_SERVER: ${{ github.server_url }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref_name }}
          GITHUB_SHA_VAL: ${{ github.sha }}
          GITHUB_EVENT: ${{ github.event_name }}
          SITE_NAME: ${{ matrix.site.name }}
          SITE_URL: ${{ matrix.site.url }}
          BROWSER_NAME: ${{ matrix.browser }}
          SUITE_TYPE: 'Checkout Funnel'
          RUN_STATUS: ${{ steps.playwright-run.outcome }}
        run: |
          node scripts/slack-notify.js --site-mode --failures-only

  # ─────────────────────────────────────────────────────────────
  # STEP 2B: RUN STANDALONE AUDITS PER SITE (FULL PARALLEL RUNNERS)
  # ─────────────────────────────────────────────────────────────
  test-standalone:
    name: 🔍 Audits • ${{ matrix.site.name }} (${{ matrix.browser }})
    if: github.event.inputs.suite == 'both' || github.event.inputs.suite == 'pricing' || !github.event.inputs.suite
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJson(needs.setup.outputs.matrix) }}
        browser:
          - Desktop
          - MobileChrome

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright Version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers (Chromium)
        run: npx playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Mask Sensitive Secrets in CI Logs
        run: |
          echo "::add-mask::${{ secrets.GEMINI_API_KEY }}"
          echo "::add-mask::${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Pre-warm DNS Cache & Static Host Mappings
        run: node -e "require('./global-setup.js')()"

      - name: Run Standalone Audits for ${{ matrix.site.name }}
        id: standalone-run
        continue-on-error: true
        run: |
          if [ "${{ matrix.browser }}" = "Desktop" ]; then
            PROJECT_NAME="${{ matrix.site.name }}"
          else
            PROJECT_NAME="${{ matrix.site.name }}_${{ matrix.browser }}"
          fi
          if [ "${{ github.event.inputs.suite }}" = "pricing" ]; then
            echo "🚀 Running Pricing Page Suite for Project: $PROJECT_NAME"
            npx playwright test tests/pricing_page.spec.ts --project="$PROJECT_NAME"
          else
            echo "🚀 Running Standalone Audits (Pricing, IP Stickiness, UI/UX) for Project: $PROJECT_NAME"
            npx playwright test tests/pricing_page.spec.ts tests/session_ip_stickiness.spec.ts tests/ui_ux_verification.spec.ts --project="$PROJECT_NAME"
          fi
        env:
          CI: true
          BASE_URL: "${{ matrix.site.url }}"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload Blob Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-blob-reports-standalone-${{ matrix.site.id }}-${{ matrix.browser }}
          path: blob-report/
          retention-days: 2

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-standalone-${{ matrix.site.id }}-${{ matrix.browser }}
          path: allure-results/
          retention-days: 2

      - name: Upload Raw Test Results & Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-standalone-${{ matrix.site.id }}-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

      - name: Send Instant Slack Failure Alert for ${{ matrix.site.name }} Audits (${{ matrix.browser }})
        if: steps.standalone-run.outcome == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_SERVER: ${{ github.server_url }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref_name }}
          GITHUB_SHA_VAL: ${{ github.sha }}
          GITHUB_EVENT: ${{ github.event_name }}
          SITE_NAME: ${{ matrix.site.name }}
          SITE_URL: ${{ matrix.site.url }}
          BROWSER_NAME: ${{ matrix.browser }}
          SUITE_TYPE: 'Standalone Audits'
          RUN_STATUS: ${{ steps.standalone-run.outcome }}
        run: |
          node scripts/slack-notify.js --site-mode --failures-only

  # ─────────────────────────────────────────────────────────────
  # STEP 3: CONSOLIDATE & REPORT (BLOB + ALLURE + NOTIFICATIONS)
  # ─────────────────────────────────────────────────────────────
  merge-reports:
    name: 📊 Consolidate Reports & Notify
    if: always()
    needs: [test-site, test-standalone]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java Runtime for Allure
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download all Blob Reports
        uses: actions/download-artifact@v4
        with:
          path: all-blobs
          pattern: all-blob-reports-*
          merge-multiple: true

      - name: Merge Playwright Reports
        run: |
          npx playwright merge-reports --config=merge.config.js ./all-blobs
        env:
          CI: true

      - name: Download all Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: all-allure-results
          merge-multiple: true

      - name: Generate Allure Report
        run: |
          npx allure generate all-allure-results --clean -o allure-report-out

      - name: Send Slack Notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_SERVER: ${{ github.server_url }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref_name }}
          GITHUB_SHA_VAL: ${{ github.sha }}
          GITHUB_EVENT: ${{ github.event_name }}
          SITE_FILTER: ${{ github.event.inputs.site_filter || 'all' }}
          SUITE_TYPE: ${{ github.event.inputs.suite == 'pricing' && 'Pricing Suite' || (github.event.inputs.suite == 'funnel' && 'Checkout Funnel' || 'Window Sticker Suite') }}
        run: |
          node scripts/slack-notify.js

      - name: Prepare Combined GitHub Pages Deployment Directory
        if: always()
        run: |
          mkdir -p gh-deploy/playwright
          cp -r playwright-report/* gh-deploy/playwright/ 2>/dev/null || true
          rm -f gh-deploy/playwright/results.json
          if [ -d "allure-report-out" ]; then
            cp -r allure-report-out/* gh-deploy/
          fi
          # Keep GitHub Pages within storage budget: drop heavy trace archives > 10MB, but preserve failure videos
          find gh-deploy -type f -name '*.zip' -size +10M -delete
          find gh-deploy -type f -size +20M -delete
          echo "📦 GitHub Pages payload size:"; du -sh gh-deploy

      - name: Manage GitHub Issues on Failure / Resolution
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          node scripts/manage-issues.js

      - name: Upload Final Consolidated Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Final Consolidated Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report-out/
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: ./gh-deploy

      - name: Deploy consolidated reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: always()
