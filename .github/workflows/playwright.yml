name: Window Sticker - Orchestrator E2E Suite

permissions:
  contents: write
  issues: write
  pages: write
  actions: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      site_filter:
        description: 'Select website to run (or "all" for all websites)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - toyota
          - dodge
          - honda
          - kia
          - audi
          - porsche
          - mercedes
          - cadillac
          - gmc
          - lexus
          - gm
          - alfaromeo
          - ford
          - chevrolet
          - bmw
          - jeep
          - hyundai
          - mclaren
          - ram
          - chrysler
          - buick
          - mitsubishi
          - lincoln
          - volvo
          - volkswagen
          - subaru
          - vwwindowstickers
          - minicooper
          - fordlookup
          - infiniti

env:
  UV_THREADPOOL_SIZE: 64
  NODE_OPTIONS: "--dns-result-order=ipv4first"

jobs:
  # ─────────────────────────────────────────────────────────────
  # STEP 1: SETUP 4-BUCKET SITE BATCH MATRIX
  # ─────────────────────────────────────────────────────────────
  setup:
    name: ⚙️ Setup Orchestrator Matrix
    runs-on: ubuntu-latest
    outputs:
      buckets: ${{ steps.set-matrix.outputs.buckets }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate 4-Bucket Site Matrix Output
        id: set-matrix
        run: |
          FILTER="${{ github.event.inputs.site_filter || 'all' }}"
          echo "Filter input: $FILTER"
          BUCKETS_JSON=$(node -e "
            const sites = require('./sites.json');
            const filter = '$FILTER';
            let buckets;
            if (filter && filter !== 'all') {
              const filtered = sites.filter(s => s.id === filter || s.brand === filter || s.name.toLowerCase().includes(filter.toLowerCase()));
              const targetSites = filtered.length ? filtered : sites;
              buckets = [{
                bucket_id: 1,
                title: 'Single Site (' + targetSites.map(s => s.id).join(', ') + ')',
                sites: targetSites
              }];
            } else {
              const NUM_BUCKETS = 4;
              buckets = Array.from({ length: NUM_BUCKETS }, (_, i) => ({
                bucket_id: i + 1,
                title: '',
                sites: []
              }));
              sites.forEach((site, index) => {
                buckets[index % NUM_BUCKETS].sites.push(site);
              });
              buckets.forEach(b => {
                const sample = b.sites.slice(0, 3).map(s => s.id).join(', ');
                b.title = 'Batch ' + b.bucket_id + ' (' + sample + '...)';
              });
            }
            console.log(JSON.stringify(buckets));
          ")
          echo "buckets=${BUCKETS_JSON}" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────
  # STEP 2: RUN SITE BATCHES (4 PARALLEL RUNNERS FOR ALL 24+ SITES)
  # ─────────────────────────────────────────────────────────────
  test-batch:
    name: 🧪 ${{ matrix.bucket.title }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        bucket: ${{ fromJson(needs.setup.outputs.buckets) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright Version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers (Chromium)
        run: npx playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Mask Sensitive Secrets in CI Logs
        run: |
          echo "::add-mask::${{ secrets.GEMINI_API_KEY }}"
          echo "::add-mask::${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Run Funnel & Standalone Audits for ${{ matrix.bucket.title }}
        id: batch-run
        run: |
          node scripts/run-site-batch.js --sites='${{ toJson(matrix.bucket.sites) }}'
        env:
          CI: true
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_SERVER: ${{ github.server_url }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref_name }}
          GITHUB_SHA_VAL: ${{ github.sha }}
          GITHUB_EVENT: ${{ github.event_name }}

      - name: Upload Blob Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-blob-reports-batch-${{ matrix.bucket.bucket_id }}
          path: blob-report/
          retention-days: 2

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-batch-${{ matrix.bucket.bucket_id }}
          path: allure-results/
          retention-days: 2

      - name: Upload Raw Test Results & Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-batch-${{ matrix.bucket.bucket_id }}
          path: test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # STEP 3: CONSOLIDATE & REPORT (BLOB + ALLURE + NOTIFICATIONS)
  # ─────────────────────────────────────────────────────────────
  merge-reports:
    name: 📊 Consolidate Reports & Notify
    if: always()
    needs: [test-batch]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java Runtime for Allure
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download all Blob Reports
        uses: actions/download-artifact@v4
        with:
          path: all-blobs
          pattern: all-blob-reports-*
          merge-multiple: true

      - name: Merge Playwright Reports
        run: |
          npx playwright merge-reports --config=merge.config.js ./all-blobs
        env:
          CI: true

      - name: Download all Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: all-allure-results
          merge-multiple: true

      - name: Generate Allure Report
        run: |
          npx allure generate all-allure-results --clean -o allure-report-out

      - name: Send Slack Notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_SERVER: ${{ github.server_url }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref_name }}
          GITHUB_SHA_VAL: ${{ github.sha }}
          GITHUB_EVENT: ${{ github.event_name }}
          SITE_FILTER: ${{ github.event.inputs.site_filter || 'all' }}
        run: |
          node scripts/slack-notify.js

      - name: Prepare Combined GitHub Pages Deployment Directory
        if: always()
        run: |
          mkdir -p gh-deploy/playwright
          cp -r playwright-report/* gh-deploy/playwright/ 2>/dev/null || true
          rm -f gh-deploy/playwright/results.json
          if [ -d "allure-report-out" ]; then
            cp -r allure-report-out/* gh-deploy/
          fi
          # Keep GitHub Pages within storage budget: drop heavy trace archives > 10MB, but preserve failure videos
          find gh-deploy -type f -name '*.zip' -size +10M -delete
          find gh-deploy -type f -size +20M -delete
          echo "📦 GitHub Pages payload size:"; du -sh gh-deploy

      - name: Manage GitHub Issues on Failure / Resolution
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          node scripts/manage-issues.js

      - name: Upload Final Consolidated Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Final Consolidated Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report-out/
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: ./gh-deploy

      - name: Deploy consolidated reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: always()
