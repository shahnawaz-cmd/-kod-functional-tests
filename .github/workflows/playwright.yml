name: Window Sticker - Orchestrator E2E Suite

permissions:
  contents: write
  issues: write
  pages: write
  actions: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      site_filter:
        description: 'Select website to run (or "all" for all websites)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - toyota
          - dodge
          - honda
          - kia
          - audi
          - porsche
          - mercedes
          - cadillac
          - gmc
          - lexus
          - gm
          - alfaromeo
          - ford
          - chevrolet
          - bmw
          - jeep
          - hyundai
          - mclaren
          - ram
          - chrysler
          - buick
          - mitsubishi
          - lincoln
          - volvo
          - volkswagen
          - subaru
          - vwwindowstickers
          - minicooper
          - fordlookup
          - infiniti

env:
  UV_THREADPOOL_SIZE: 64
  NODE_OPTIONS: "--dns-result-order=ipv4first"

jobs:
  # ─────────────────────────────────────────────────────────────
  # STEP 1: UPFRONT FLOW DETECTION & 1-SITE-PER-RUNNER MATRIX
  # ─────────────────────────────────────────────────────────────
  setup-matrix:
    name: 🔍 Flow Detection & Matrix Setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sites_matrix: ${{ steps.generate-matrix.outputs.sites_matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Detection
        run: npx playwright install chromium

      - name: Pre-warm DNS Cache
        run: node -e "require('./global-setup.js')()"

      - name: Run Upfront Concurrent Flow Detection
        run: |
          FILTER="${{ github.event.inputs.site_filter || 'all' }}"
          if [ "$FILTER" != "all" ] && [ -n "$FILTER" ]; then
            echo "Inspecting single target site: $FILTER"
            node scripts/detect-flow.js
          else
            echo "Inspecting all 30 production domains concurrently..."
            node scripts/detect-flow.js --all
          fi

      - name: Generate 1-Site-Per-Runner Matrix
        id: generate-matrix
        run: |
          FILTER="${{ github.event.inputs.site_filter || 'all' }}"
          node -e "
            const fs = require('fs');
            const sites = require('./sites.json');
            let flowMap = {};
            try {
              flowMap = JSON.parse(fs.readFileSync('./flow-detection.json', 'utf-8'));
            } catch (e) {}

            const filter = '$FILTER';
            let selected = sites;
            if (filter && filter !== 'all') {
              selected = sites.filter(s => s.id === filter || s.brand === filter || s.name.toLowerCase().includes(filter.toLowerCase()));
              if (selected.length === 0) selected = sites;
            }

            const matrix = selected.map(s => {
              const flow = flowMap[s.name] || 'streaming';
              const testFile = flow === 'non_streaming'
                ? 'tests/global_case_verification.spec.ts'
                : 'streaming Task/global_streaming_specs.spec.js';
              return {
                id: s.id,
                name: s.name,
                url: s.url,
                flow: flow,
                testFile: testFile
              };
            });

            console.log('Generated matrix entries: ' + matrix.length);
            const jsonStr = JSON.stringify(matrix);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'sites_matrix=' + jsonStr + '\n');
          "

  # ─────────────────────────────────────────────────────────────
  # STEP 2: 1 SITE PER RUNNER (PARALLEL EXECUTION)
  # ─────────────────────────────────────────────────────────────
  site-runner:
    name: 🧪 ${{ matrix.site.name }} (${{ matrix.site.flow }})
    needs: setup-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        site: ${{ fromJson(needs.setup-matrix.outputs.sites_matrix) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright Version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers (Chromium)
        run: npx playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Mask Sensitive Secrets in CI Logs
        run: |
          echo "::add-mask::${{ secrets.GEMINI_API_KEY }}"
          echo "::add-mask::${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Pre-warm DNS Cache & Static Host Mappings
        run: node -e "require('./global-setup.js')()"

      - name: Run Funnel & Audits for ${{ matrix.site.name }}
        run: |
          npx playwright test "${{ matrix.site.testFile }}" tests/pricing_page.spec.ts tests/session_ip_stickiness.spec.ts tests/ui_ux_verification.spec.ts --project="${{ matrix.site.name }}" --project="${{ matrix.site.name }}_MobileChrome" --workers=2
        env:
          CI: true
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Upload Blob Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-blob-reports-${{ matrix.site.id }}
          path: blob-report/
          retention-days: 2

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.site.id }}
          path: allure-results/
          retention-days: 2

      - name: Upload Failure Videos & Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.site.id }}
          path: test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # STEP 3: CONSOLIDATE & REPORT (BLOB + ALLURE + NOTIFICATIONS)
  # ─────────────────────────────────────────────────────────────
  merge-reports:
    name: 📊 Consolidate Reports & Notify
    if: always()
    needs: [setup-matrix, site-runner]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java Runtime for Allure
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download all Blob Reports
        uses: actions/download-artifact@v4
        with:
          path: all-blobs
          pattern: all-blob-reports-*
          merge-multiple: true

      - name: Merge Playwright Reports
        run: |
          npx playwright merge-reports --config=merge.config.js ./all-blobs
        env:
          CI: true

      - name: Download all Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: all-allure-results
          merge-multiple: true

      - name: Generate Allure Report
        run: |
          npx allure generate all-allure-results --clean -o allure-report-out

      - name: Send Slack Notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_SERVER: ${{ github.server_url }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref_name }}
          GITHUB_SHA_VAL: ${{ github.sha }}
          GITHUB_EVENT: ${{ github.event_name }}
          SITE_FILTER: ${{ github.event.inputs.site_filter || 'all' }}
        run: |
          node scripts/slack-notify.js

      - name: Prepare Combined GitHub Pages Deployment Directory
        if: always()
        run: |
          mkdir -p gh-deploy/playwright
          cp -r playwright-report/* gh-deploy/playwright/ 2>/dev/null || true
          rm -f gh-deploy/playwright/results.json
          if [ -d "allure-report-out" ]; then
            cp -r allure-report-out/* gh-deploy/
          fi
          # Keep GitHub Pages within storage budget: drop heavy trace archives > 10MB, but preserve failure videos
          find gh-deploy -type f -name '*.zip' -size +10M -delete
          find gh-deploy -type f -size +20M -delete
          echo "📦 GitHub Pages payload size:"; du -sh gh-deploy

      - name: Manage GitHub Issues on Failure / Resolution
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          node scripts/manage-issues.js

      - name: Upload Final Consolidated Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Final Consolidated Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report-out/
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: ./gh-deploy

      - name: Deploy consolidated reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: always()
