name: Window Sticker - Orchestrator E2E Suite

permissions:
  contents: write
  issues: write
  pages: write
  actions: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      site_filter:
        description: 'Select website to run (or "all" for all websites)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - toyota
          - dodge
          - honda
          - kia
          - audi
          - porsche
          - mercedes
          - cadillac
          - gmc
          - lexus
          - gm
          - alfaromeo
          - ford
          - chevrolet
          - bmw
          - jeep
          - hyundai
          - mclaren
          - ram
          - chrysler
          - buick
          - mitsubishi
          - lincoln
          - volvo
          - volkswagen
          - subaru
          - vwwindowstickers
          - minicooper
          - fordlookup
          - infiniti

env:
  UV_THREADPOOL_SIZE: 64
  NODE_OPTIONS: "--dns-result-order=ipv4first"

jobs:
  # ─────────────────────────────────────────────────────────────
  # TRACK 1: STANDALONE AUDITS (RUNS IMMEDIATELY, NO FLOW DETECTION)
  # ─────────────────────────────────────────────────────────────
  standalone-audits:
    name: 📊 Standalone Audits (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: ['1/10', '2/10', '3/10', '4/10', '5/10', '6/10', '7/10', '8/10', '9/10', '10/10']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright Version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers (Chromium)
        run: npx playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Pre-warm DNS Cache & Static Host Mappings
        run: node -e "require('./global-setup.js')()"

      - name: Run Standalone Audits (Pricing, IP Stickiness, UI/UX)
        run: |
          npx playwright test tests/pricing_page.spec.ts tests/session_ip_stickiness.spec.ts tests/ui_ux_verification.spec.ts --shard=${{ matrix.shard }} --workers=2
        env:
          CI: true

      - name: Upload Audits Blob Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-blob-reports-audits-${{ strategy.job-index }}
          path: blob-report/
          retention-days: 2

      - name: Upload Audits Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-audits-${{ strategy.job-index }}
          path: allure-results/
          retention-days: 2

  # ─────────────────────────────────────────────────────────────
  # TRACK 2A: UPFRONT FLOW DETECTION FOR SITES (RUNS CONCURRENTLY)
  # ─────────────────────────────────────────────────────────────
  funnel-detect:
    name: 🔍 Flow Detection & Matrix Setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.set-shards.outputs.shards }}
      filter: ${{ steps.set-shards.outputs.filter }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Detection
        run: npx playwright install chromium

      - name: Pre-warm DNS Cache
        run: node -e "require('./global-setup.js')()"

      - name: Run Fast Concurrent Flow Detection
        run: |
          node scripts/detect-flow.js --all

      - name: Generate Funnel Shard Matrix
        id: set-shards
        run: |
          FILTER="${{ github.event.inputs.site_filter || 'all' }}"
          echo "Filter input: $FILTER"
          SHARDS_JSON=$(node -e "
            const filter = '$FILTER';
            if (filter && filter !== 'all') {
              console.log(JSON.stringify(['single']));
            } else {
              console.log(JSON.stringify(['1/10', '2/10', '3/10', '4/10', '5/10', '6/10', '7/10', '8/10', '9/10', '10/10']));
            }
          ")
          echo "shards=${SHARDS_JSON}" >> $GITHUB_OUTPUT
          echo "filter=${FILTER}" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────
  # TRACK 2B: CHECKOUT FUNNEL EXECUTION (USING DETECTED FLOW FILES)
  # ─────────────────────────────────────────────────────────────
  funnel-tests:
    name: 🚀 Checkout Funnel (${{ matrix.shard }})
    needs: funnel-detect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: ${{ fromJson(needs.funnel-detect.outputs.shards) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright Version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers (Chromium)
        run: npx playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Mask Sensitive Secrets in CI Logs
        run: |
          echo "::add-mask::${{ secrets.GEMINI_API_KEY }}"
          echo "::add-mask::${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Pre-warm DNS Cache & Static Host Mappings
        run: node -e "require('./global-setup.js')()"

      - name: Run Checkout Funnel Shard (${{ matrix.shard }})
        run: |
          FILTER="${{ needs.funnel-detect.outputs.filter }}"
          if [ "$FILTER" != "all" ] && [ -n "$FILTER" ]; then
            SITE_NAME=$(node -e "
              const sites = require('./sites.json');
              const filter = '$FILTER';
              const s = sites.find(x => x.id === filter || x.brand === filter || x.name.toLowerCase().includes(filter.toLowerCase()));
              console.log(s ? s.name : filter);
            ")
            npx playwright test "streaming Task/global_streaming_specs.spec.js" --project="$SITE_NAME" --project="${SITE_NAME}_MobileChrome" --workers=2
          else
            npx playwright test "streaming Task/global_streaming_specs.spec.js" --shard=${{ matrix.shard }} --workers=2
          fi
        env:
          CI: true
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Upload Funnel Blob Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-blob-reports-funnel-${{ strategy.job-index }}
          path: blob-report/
          retention-days: 2

      - name: Upload Funnel Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-funnel-${{ strategy.job-index }}
          path: allure-results/
          retention-days: 2

      - name: Upload Raw Test Results & Failure Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-funnel-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # STEP 3: CONSOLIDATE & REPORT (BLOB + ALLURE + NOTIFICATIONS)
  # ─────────────────────────────────────────────────────────────
  merge-reports:
    name: 📊 Consolidate Reports & Notify
    if: always()
    needs: [standalone-audits, funnel-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java Runtime for Allure
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download all Blob Reports
        uses: actions/download-artifact@v4
        with:
          path: all-blobs
          pattern: all-blob-reports-*
          merge-multiple: true

      - name: Merge Playwright Reports
        run: |
          npx playwright merge-reports --config=merge.config.js ./all-blobs
        env:
          CI: true

      - name: Download all Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: all-allure-results
          merge-multiple: true

      - name: Generate Allure Report
        run: |
          npx allure generate all-allure-results --clean -o allure-report-out

      - name: Send Slack Notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_SERVER: ${{ github.server_url }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref_name }}
          GITHUB_SHA_VAL: ${{ github.sha }}
          GITHUB_EVENT: ${{ github.event_name }}
          SITE_FILTER: ${{ github.event.inputs.site_filter || 'all' }}
        run: |
          node scripts/slack-notify.js

      - name: Prepare Combined GitHub Pages Deployment Directory
        if: always()
        run: |
          mkdir -p gh-deploy/playwright
          cp -r playwright-report/* gh-deploy/playwright/ 2>/dev/null || true
          rm -f gh-deploy/playwright/results.json
          if [ -d "allure-report-out" ]; then
            cp -r allure-report-out/* gh-deploy/
          fi
          # Keep GitHub Pages within storage budget: drop heavy trace archives > 10MB, but preserve failure videos
          find gh-deploy -type f -name '*.zip' -size +10M -delete
          find gh-deploy -type f -size +20M -delete
          echo "📦 GitHub Pages payload size:"; du -sh gh-deploy

      - name: Manage GitHub Issues on Failure / Resolution
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          node scripts/manage-issues.js

      - name: Upload Final Consolidated Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Final Consolidated Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report-out/
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: ./gh-deploy

      - name: Deploy consolidated reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: always()
